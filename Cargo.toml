[package]
name = "computer-use-linux"
version = "0.7.10"
edition = "2021"
authors = ["Avi Fenesh <avifenesh@users.noreply.github.com>"]
license = "MIT"
description = "Linux desktop control over MCP — AT-SPI accessibility tree, multi-compositor window targeting (GNOME, KWin, Hyprland, i3, COSMIC), screencast portal screenshots, and ydotool input synthesis. Wayland-first, X11 best-effort."
homepage = "https://github.com/agent-sh/computer-use-linux"
repository = "https://github.com/agent-sh/computer-use-linux"
documentation = "https://github.com/agent-sh/computer-use-linux#readme"
readme = "README.md"
keywords = ["mcp", "computer-use", "accessibility", "gnome", "wayland"]
categories = ["accessibility", "command-line-utilities", "os::linux-apis"]

[[bin]]
name = "computer-use-linux"
path = "src/main.rs"

[[bin]]
name = "computer-use-linux-cosmic"
path = "src/bin/computer-use-linux-cosmic.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
anyhow = "1.0.102"
base64 = "0.22.1"
evdev = "0.13.2"
cosmic-protocols = { version = "0.2.0", default-features = false, features = ["client"] }
futures-util = "0.3.32"
getrandom = "0.4.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
rustix = { version = "1.1", features = ["net"] }
rmcp = { version = "2.1.0", features = ["transport-io"] }
schemars = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.51.1", features = ["fs", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# Pure-Rust X11 client (no libxcb). Native X11 sessions only: absolute window
# origins for the EWMH backend (wmctrl -lG counts the frame offset twice, #157).
x11rb = "0.14"
xkeysym = "0.2.1"
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "proxy", "service", "unixexec", "ibus"] }

# In-memory authenticated D-Bus fixtures; production AT-SPI routing stays on the bus.
[dev-dependencies]
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "proxy", "service", "bus-impl"] }

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"
strip = "symbols"
